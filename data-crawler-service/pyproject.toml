[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dealer-crawler"
version = "0.1.0"
description = "Dealer data crawler for DealerConnect: India-first, hybrid HTTP adapters + AI extraction"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "lxml>=5.3",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "phonenumbers>=8.13",
    "rapidfuzz>=3.10",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
ai = ["anthropic>=1.0"]
pdf = ["pdfplumber>=0.11"]
dev = ["pytest>=8.3", "ruff>=0.8", "respx>=0.22"]

[project.scripts]
dealer-crawler = "crawler.cli:main"

[tool.setuptools.packages.find]
include = ["crawler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
